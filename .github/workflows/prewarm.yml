name: Flashcard Cache Prewarm

# Warms whichever Lambda container the ALB routes to, and — more importantly —
# computes the league first-pitch baseline every card grades against. That baseline
# lives in per-container /tmp, so a fresh container reads "league avg pending" until
# something populates it.
#
# This used to request the season-scale /api/teams/range, which cannot finish inside
# the Lambda's 240s timeout: it burned a full 240s invocation every 30 minutes,
# never wrote the cache the comment claimed it warmed, and contended with live coach
# traffic for the same throughput-limited upstream. /api/league-baseline does the job
# in ~45s by fetching 0-0 pitches only. Best-effort: failures don't page anyone.

on:
  schedule:
    # every 30 minutes, roughly 5am-11pm ET year-round (UTC window is fixed,
    # so it shifts an hour between EDT and EST — fine for best-effort warming)
    - cron: '*/30 0-4,9-23 * * *'
  workflow_dispatch:

jobs:
  prewarm:
    runs-on: ubuntu-latest
    steps:
      - name: Warm season range windows
        run: |
          BASE="https://www.alpb-analytics.com/widgets/flashcard/api"
          START="2026-04-21"
          TODAY=$(date -u +%F)
          # The same ≤30-day windows the client loads a wide range through
          # (planRangeChunks): warming them here means a coach's season click
          # finds every window already cached and skips straight to the teams.
          # summary=1 keeps each response tiny; the server does the real work.
          cursor="$START"
          while [ "$(date -ud "$cursor" +%s)" -le "$(date -ud "$TODAY" +%s)" ]; do
            end=$(date -ud "$cursor + 29 days" +%F)
            [ "$(date -ud "$end" +%s)" -gt "$(date -ud "$TODAY" +%s)" ] && end="$TODAY"
            out=$(curl -s --http1.1 -o /dev/null -w "%{http_code} total=%{time_total}s" --max-time 200 --compressed "${BASE}/teams/range?startDate=${cursor}&endDate=${end}&maxVelocity=105&pitchGroup=All&summary=1") || true
            echo "window ${cursor}..${end}: ${out:-request failed}"
            cursor=$(date -ud "$cursor + 30 days" +%F)
          done
          # Assemble + memoize the full span so the team slices are served warm.
          out=$(curl -s --http1.1 -o /dev/null -w "%{http_code} total=%{time_total}s" --max-time 240 --compressed "${BASE}/teams/range?startDate=${START}&endDate=${TODAY}&maxVelocity=105&pitchGroup=All&summary=1") || true
          echo "season summary: ${out:-request failed}"

      - name: Warm league first-pitch baseline
        run: |
          BASE="https://www.alpb-analytics.com/widgets/flashcard/api"
          out=$(curl -s --http1.1 -o /tmp/baseline.json -w "%{http_code} total=%{time_total}s" --max-time 120 --compressed "${BASE}/league-baseline") || true
          echo "league-baseline: ${out:-request failed} $(cat /tmp/baseline.json 2>/dev/null | head -c 200)"

      - name: Warm batter index
        run: |
          BASE="https://www.alpb-analytics.com/widgets/flashcard/api"
          out=$(curl -s --http1.1 -o /dev/null -w "%{http_code} total=%{time_total}s" --max-time 120 --compressed "${BASE}/batters") || true
          echo "batters: ${out:-request failed}"
