name: Flashcard Deploy

# Builds the widget-flashcard container (arm64 + Lambda Web Adapter) and deploys it to the
# widget-flashcard Lambda behind the shared slugger-alb at /widgets/flashcard/*.
# Auth is via GitHub OIDC (role github-actions-deploy) — no static AWS keys.
# update-function-code does NOT change memory/timeout/env, so the live 2048MB memory +
# AWS_LWA_ENABLE_COMPRESSION config is preserved by every deploy. A best-effort step
# below raises only the timeout (full-season fetches approach the old 120s cap as the
# season grows); if the deploy role lacks UpdateFunctionConfiguration it is skipped.

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: widget-flashcard
  LAMBDA_FUNCTION: widget-flashcard

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: flashcard-cicd

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build & push image (arm64)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/arm64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --provenance=false --push .

      - name: Update Lambda function
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION \
            --image-uri $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Wait for Lambda update
        run: aws lambda wait function-updated --function-name $LAMBDA_FUNCTION

      - name: Raise Lambda timeout for season-scale loads (best-effort)
        continue-on-error: true
        run: |
          # Full-season /api/teams/range fetches run ~90s+ and grow with the season;
          # the ALB idle timeout is 300s, so 240s keeps headroom on both sides.
          # Only --timeout is passed: memory/env/image stay untouched.
          current=$(aws lambda get-function-configuration \
            --function-name $LAMBDA_FUNCTION --query Timeout --output text 2>/dev/null || echo 0)
          case "$current" in ''|*[!0-9]*) current=0;; esac
          if [ "$current" -ge 240 ]; then
            echo "Timeout already ${current}s — nothing to do"; exit 0
          fi
          if aws lambda update-function-configuration \
               --function-name $LAMBDA_FUNCTION --timeout 240; then
            aws lambda wait function-updated --function-name $LAMBDA_FUNCTION
            echo "Timeout raised ${current}s -> 240s"
          else
            echo "::warning::Could not raise Lambda timeout (role likely lacks lambda:UpdateFunctionConfiguration); season loads stay capped at ${current}s"
          fi

      - name: Smoke test
        run: |
          # Retry to absorb the arm64 Lambda cold start after the image swap.
          # Capture the HTTP status cleanly: curl can write the code via -w yet still
          # exit non-zero on a body-transfer hiccup, so gate on the status, not curl's exit.
          URL="https://www.alpb-analytics.com/widgets/flashcard/"
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL") || true
            case "$code" in
              200|301|302|308) echo "Smoke OK ($code) on attempt $i"; exit 0 ;;
            esac
            echo "attempt $i: HTTP $code — retrying in 15s"; sleep 15
          done
          echo "Smoke FAILED after 10 attempts"; exit 1

      - name: Smoke test data path (7-day range)
        run: |
          # The static page can be green while the data path 502s — assert the API
          # itself works and ships the columnar format. A 7-day range answers in
          # seconds, so this is the deterministic gate.
          END=$(date -u +%F)
          START=$(date -u -d "7 days ago" +%F)
          URL="https://www.alpb-analytics.com/widgets/flashcard/api/teams/range?startDate=${START}&endDate=${END}&maxVelocity=105&pitchGroup=All"
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/week.json -w "%{http_code}" --max-time 120 --compressed "$URL") || echo "curl exit: $?"
            size=$(wc -c < /tmp/week.json 2>/dev/null || echo 0)
            echo "attempt $i: HTTP ${code:-none}, ${size} bytes"
            if [ "${code:-}" = "200" ] && [ "$size" -gt 20000 ] && grep -q '"pzLegend"' /tmp/week.json; then
              echo "7-day data path OK"; exit 0
            fi
            sleep 15
          done
          echo "7-day data path smoke FAILED"; exit 1

      - name: Smoke test data path (season-scale range)
        run: |
          # Season-scale = the failure class the columnar format fixes (response
          # oversize/timeout). A cold container + cold cache answers after ~90-110s
          # of silence; GitHub runners have been seen returning "HTTP 200, 0 bytes"
          # for those long-TTFB responses, so treat empty-body attempts as prewarms
          # (each one populates a container's disk cache server-side) and retry —
          # warm answers arrive in ~15s. Genuine 5xx/oversize still fails all tries.
          START="2026-04-21"
          END=$(date -u +%F)
          URL="https://www.alpb-analytics.com/widgets/flashcard/api/teams/range?startDate=${START}&endDate=${END}&maxVelocity=105&pitchGroup=All"
          for i in 1 2 3 4; do
            meta=$(curl -sS -o /tmp/season.json -w "%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s" \
              --max-time 280 --compressed "$URL" 2>/tmp/curlerr) || echo "curl exit $?: $(cat /tmp/curlerr 2>/dev/null)"
            code=${meta%% *}
            size=$(wc -c < /tmp/season.json 2>/dev/null || echo 0)
            echo "attempt $i: HTTP ${code:-none} (${meta:-no metadata}) ${size} bytes"
            if [ "${code:-}" = "200" ] && [ "$size" -gt 100000 ] && grep -q '"pzLegend"' /tmp/season.json; then
              echo "Season data path OK"; exit 0
            fi
            sleep 20
          done
          echo "Season data path smoke FAILED"; exit 1
