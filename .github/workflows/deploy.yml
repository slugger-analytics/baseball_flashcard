name: Flashcard Deploy

# Builds the widget-flashcard container (arm64 + Lambda Web Adapter) and deploys it to the
# widget-flashcard Lambda behind the shared slugger-alb at /widgets/flashcard/*.
# Auth is via GitHub OIDC (role github-actions-deploy) — no static AWS keys.
# update-function-code does NOT change memory/timeout/env, so the live 2048MB/120s +
# AWS_LWA_ENABLE_COMPRESSION config is preserved by every deploy.

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: widget-flashcard
  LAMBDA_FUNCTION: widget-flashcard

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: flashcard-cicd

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build & push image (arm64)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/arm64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --provenance=false --push .

      - name: Update Lambda function
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION \
            --image-uri $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Wait for Lambda update
        run: aws lambda wait function-updated --function-name $LAMBDA_FUNCTION

      - name: Smoke test
        run: |
          # Retry to absorb the arm64 Lambda cold start after the image swap.
          # Capture the HTTP status cleanly: curl can write the code via -w yet still
          # exit non-zero on a body-transfer hiccup, so gate on the status, not curl's exit.
          URL="https://www.alpb-analytics.com/widgets/flashcard/"
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL") || true
            case "$code" in
              200|301|302|308) echo "Smoke OK ($code) on attempt $i"; exit 0 ;;
            esac
            echo "attempt $i: HTTP $code — retrying in 15s"; sleep 15
          done
          echo "Smoke FAILED after 10 attempts"; exit 1
