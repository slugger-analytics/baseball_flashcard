name: CI

# Checks run on every push and PR with NO secrets required.
#
# Checks only — deployment lives in deploy.yml, which builds the container and
# updates the widget-flashcard Lambda behind www.alpb-analytics.com/widgets/flashcard.

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the production runtime (Dockerfile: node:20-slim)
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (server + client bundle)
        run: |
          node --check server.js
          node --check app.js
          node --check pitch_logic.js

      - name: Unit tests (pure logic, node:test)
        run: npm run test:unit

      - name: Smoke test (boots server without secrets)
        # test_smoke.js requires server.js as a module, listens on an ephemeral
        # port, and asserts: static index.html serves, /health + /api/health +
        # /api/cache-status answer, and /api/batter/card fails gracefully (400
        # missing-batter, 404 future-window) with no SLUGGER_API_KEY configured.
        run: npm test
